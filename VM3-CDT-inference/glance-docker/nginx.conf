server {
    listen 3000;

    # SPA Glance — servita dalla root del container
    location /glance/ {
        root  /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Serve file mesh via fetch() da Glance
    location /data/ {
        alias /data/;
        autoindex on;
        add_header Access-Control-Allow-Origin  *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }
}