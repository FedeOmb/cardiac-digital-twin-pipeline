
server {
    listen 80;
    server_name _;

    # Dashboard files
    location / {
        root /usr/share/nginx/dashboard;
        try_files $uri /index.html =404;
    }
    location /assets/ {
        root /usr/share/nginx/dashboard;
    }
# --- biv-me pipeline (VM2) ---
location = /biv-me {
    return 301 /biv-me/lab/;
}
    # biv-me jupyter web interface
    location /biv-me/ {
        proxy_pass         http://vm2:8090/biv-me/;
        client_max_body_size 100m;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }
    # biv-me viewcorrection web interface
    location /biv-me/viewcorrection/ {
        proxy_pass         http://vm2:8095/biv-me/viewcorrection/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
        proxy_buffering    off;
        proxy_cache        off;    
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

# ----- MATLAB CobiVeco (VM2) ---- 
    location = /matlab {
        return 301 /matlab/;
    }

    location /matlab/ {
        proxy_pass         http://vm2:8099/matlab/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarder-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

# ----- CDT Framework (VM3 localhost) -----
    location /cdt-framework/ {
        client_max_body_size 100m;
        proxy_pass         http://cdt-framework:8888/cdt-framework/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }

# ----- CDT Monodomain Translation Opencarp (VM3 localhost) -----
    location /monodomain/ {
        client_max_body_size 100m;
        proxy_pass         http://vm3:9090/monodomain/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

# ----- ParaView Glance (VM3 localhost) -----
location /glance/ {
    proxy_pass      http://paraview-glance:3000/glance/;

    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 86400;
    proxy_buffering    off;

    # Path rewriting for subpath /glance/
    sub_filter_once off;
    sub_filter_types text/html application/javascript text/css;
    sub_filter '="/static/'  '="/glance/static/';
    sub_filter '="/manifest' '="/glance/manifest';
    sub_filter '="/'         '="/glance/';
}

location = /glance {
    return 301 /glance/;
}
}
